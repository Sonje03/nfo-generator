name: Build & Release

# Triggered when a version tag is pushed (e.g. v1.0.0-beta).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to upload assets to the release

# Opt every JavaScript-based action into the Node.js 24 runtime ahead of
# GitHub's June 2026 cutoff. Silences the "Node.js 20 actions are
# deprecated" warnings on every run.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: NFO-Generator-macOS
          - os: windows-latest
            artifact: NFO-Generator-Windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ---- Provide libmediainfo per platform --------------------------------
      - name: Install libmediainfo (macOS)
        if: runner.os == 'macOS'
        run: |
          # --formula disambiguates from the cask of the same name and
          # silences brew's "Treating mediainfo as a formula" warning.
          brew install --formula mediainfo
          mkdir -p lib
          # brew ships the versioned dylib (libmediainfo.0.dylib). Copy it
          # to the unversioned name PyInstaller expects.
          SRC=$(ls "$(brew --prefix)/lib/libmediainfo"*.dylib | head -1)
          cp "$SRC" lib/libmediainfo.dylib
          ls -la lib/

      - name: Install libmediainfo (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # `mediainfo-cli` only ships the CLI exe, not the DLL we need.
          # `mediainfo` (the GUI package) ships MediaInfo.dll under
          # C:\Program Files\MediaInfo\. Use that.
          choco install mediainfo -y --no-progress
          New-Item -ItemType Directory -Force -Path lib | Out-Null
          $candidates = @(
            "C:\Program Files\MediaInfo\MediaInfo.dll",
            "C:\Program Files (x86)\MediaInfo\MediaInfo.dll"
          )
          $found = $null
          foreach ($p in $candidates) {
            if (Test-Path $p) { $found = $p; break }
          }
          if (-not $found) {
            # Last resort: scan C:\Program Files recursively.
            $found = (Get-ChildItem -Path "C:\Program Files" -Recurse `
              -Filter "MediaInfo.dll" -ErrorAction SilentlyContinue |
              Select-Object -First 1).FullName
          }
          if (-not $found) { throw "MediaInfo.dll not found after install" }
          Write-Host "Found MediaInfo.dll at: $found"
          Copy-Item $found lib\
          Get-ChildItem lib\

      # ---- Build with PyInstaller ------------------------------------------
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          FFMPEG=$(python -c "import imageio_ffmpeg as f; print(f.get_ffmpeg_exe())")
          # Strip the leading "v" from the tag to get a clean version string.
          VERSION="${GITHUB_REF_NAME#v}"
          pyinstaller --onedir --windowed --name "NFO Generator" \
            --icon assets/icon.icns \
            --osx-bundle-identifier com.sonje03.nfo-generator \
            --add-binary "lib/libmediainfo.dylib:lib" \
            --add-binary "$FFMPEG:imageio_ffmpeg/binaries" \
            --add-data "assets:assets" \
            --collect-data pyfiglet \
            NFO_generator.py

          # Patch Info.plist so the About box / Finder show the right
          # version + copyright instead of the default 0.0.0.
          PLIST="dist/NFO Generator.app/Contents/Info.plist"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$PLIST"
          plutil -replace CFBundleVersion           -string "$VERSION" "$PLIST"
          plutil -insert NSHumanReadableCopyright   -string "MIT © 2026 Sonje03" "$PLIST" || \
            plutil -replace NSHumanReadableCopyright -string "MIT © 2026 Sonje03" "$PLIST"

          # Ad-hoc codesign every binary in the bundle, then the bundle
          # itself. Without a paid Apple Developer ID we can't satisfy
          # Gatekeeper fully, but ad-hoc signing fixes the "damaged" error
          # on macOS Sequoia — users will see a normal "unidentified
          # developer" warning they can bypass with right-click → Open.
          codesign --force --deep --sign - "dist/NFO Generator.app"

          cd dist && zip -r "${{ matrix.artifact }}.zip" "NFO Generator.app"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ffmpeg = python -c "import imageio_ffmpeg as f; print(f.get_ffmpeg_exe())"
          pyinstaller --onedir --windowed --name "NFO Generator" `
            --icon assets\icon.ico `
            --add-binary "lib\MediaInfo.dll;lib" `
            --add-binary "$ffmpeg;imageio_ffmpeg/binaries" `
            --add-data "assets;assets" `
            --collect-data pyfiglet `
            NFO_generator.py
          Compress-Archive -Path "dist\NFO Generator\*" -DestinationPath "dist\${{ matrix.artifact }}.zip"

      # ---- Attach the zip to the GitHub Release -----------------------------
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact }}.zip
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
